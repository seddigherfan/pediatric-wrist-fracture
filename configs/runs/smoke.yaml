image_size: 320
epochs: 1
patience: 1
batch_size: 4
run:
  name: smoke
  output_root: outputs/experiments
  resume: false
  save_period: 1
  validation_split: val
  test_split: test
  allow_test_evaluation: false
  selection_metric: metrics/mAP50-95(B)
  repeated_runs: 1
  batch_size_policy: fixed
  run_id: smoke-placeholder
